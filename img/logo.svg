      <stop offset="0" stop-color="#1B2844"/>
      <stop offset="1" stop-color="#0A101D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1DBA6"/>
      <stop offset=".55" stop-color="#C9A45C"/>
      <stop offset="1" stop-color="#A27D3B"/>
